[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-agent"
version = "0.1.0"
description = "Loom: a hierarchical multi-agent coding assistant CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "anthropic>=0.34",
    "httpx>=0.27",
    "GitPython>=3.1",
]

# tree-sitter-languages is a nice-to-have (better symbol extraction for the
# repo map) but its prebuilt wheels lag behind new Python releases and it
# can fail to install on the newest interpreter. loom/context/repo_map.py
# already falls back to a regex-based extractor when it's absent, so it's
# opt-in here rather than blocking `pip install` entirely.
[project.optional-dependencies]
treesitter = ["tree-sitter>=0.21,<0.22", "tree-sitter-languages>=1.10"]
# Only needed if you register an OpenAI (or OpenAI-compatible) key via
# `loom keys add openai ...`. Not required for the default Anthropic path.
openai = ["openai>=1.40"]
# Needed to activate/verify a Team license (`loom license activate`).
license = ["cryptography>=42"]
all = ["tree-sitter>=0.21,<0.22", "tree-sitter-languages>=1.10", "openai>=1.40", "cryptography>=42"]

[project.scripts]
loom = "loom.cli:app"

[tool.setuptools.packages.find]
include = ["loom*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning:tree_sitter"]

